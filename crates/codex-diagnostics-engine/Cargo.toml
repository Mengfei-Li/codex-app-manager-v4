[package]
name = "codex-diagnostics-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
