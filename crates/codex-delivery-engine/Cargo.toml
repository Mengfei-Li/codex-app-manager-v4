[package]
name = "codex-delivery-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Signed bootstrap delivery, transactional Codex configuration, locale, and verification kernel for V4."

[dependencies]
base64 = "0.23"
ed25519-dalek = "3.0.0"
fs4 = { version = "1.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
time = { version = "0.3.47", features = ["parsing"] }
toml_edit = "0.25.13"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
tempfile = "3.23"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
winreg = "0.56.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
