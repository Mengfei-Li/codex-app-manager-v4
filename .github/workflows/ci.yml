name: CI

# Fast branch/pull-request gate: type-check, unit tests and a cross-platform Rust
# clippy/test pass. The heavy signed/notarized bundle build stays in
# the default-branch release.yml (signalled by v* tags) — this never builds or
# signs the .app.
on:
  pull_request:
  push:
    branches: [codex/v4-main]

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test --if-present
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # tauri-build (frontendDist: ../dist) reads the built frontend at compile
      # time, so produce dist before touching cargo. We deliberately do NOT run
      # `tauri build` here — no bundling, no signing, no notarization.
      - name: Build frontend (for tauri-build)
        run: npm run build
      - name: Clippy (deny warnings)
        run: node scripts/run-clippy-annotated.mjs
      - name: Test (src-tauri)
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      # Path deps are not workspace members, so their unit/integration tests are
      # not covered by the step above. Run each engine crate explicitly so
      # mac/win pure-logic regressions fail required CI on every PR.
      - name: Test codex-mac-engine (standalone)
        run: cargo test --manifest-path crates/codex-mac-engine/Cargo.toml --all-targets
      - name: Test codex-win-engine (standalone)
        run: cargo test --manifest-path crates/codex-win-engine/Cargo.toml --all-targets

  audit:
    name: Blocking dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: 1.97.1
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=low
      - name: Install pinned cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          archive=cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$archive"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $archive" | sha256sum --check --strict
          tar -xzf "$archive"
          sudo install -m 0755 \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            /usr/local/bin/cargo-deny
      - name: Cargo advisories, licenses and sources
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-pc-windows-msvc
            aarch64-pc-windows-msvc
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          for target in "${targets[@]}"; do
            cargo deny \
              --manifest-path src-tauri/Cargo.toml \
              --config src-tauri/deny.toml \
              --target "$target" \
              --locked \
              check advisories licenses sources \
              --deny warnings
          done

  worker-test:
    name: Cloudflare worker tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Cloudflare changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > changed-files.txt
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
            git diff --name-only "$BEFORE_SHA" HEAD > changed-files.txt || git show --name-only --format= HEAD > changed-files.txt
          else
            git show --name-only --format= HEAD > changed-files.txt
          fi

          if grep -q '^cloudflare/' changed-files.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No cloudflare/** changes; skipping worker tests."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: cloudflare/manager-download-router/package-lock.json

      - name: Install worker dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: cloudflare/manager-download-router
        run: npm ci

      - name: Run worker tests
        if: steps.changes.outputs.run == 'true'
        working-directory: cloudflare/manager-download-router
        run: npm test
